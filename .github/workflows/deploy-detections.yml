name: Deploy Detections + Evidence
on:
  push: {branches: [main], paths: ['rules/**', 'chronicle/**', 'deploy/**', 'scripts/**']}
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: az login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Generate 50 rules
        run: python3 scripts/generate_50_rules.py --out rules
      - name: Validate (pytest)
        run: |
          pip install pytest -q
          python -m pytest tests/ -q || true   # optional gate: remove || true for hard gate
      - name: Deploy analytics rules to Sentinel
        run: |
          python3 deploy/deploy_analytics_rules.py \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group rg-soc-lab --workspace law-soc
      - name: Build compliance evidence
        run: |
          mkdir -p evidence
          python3 scripts/evidence_report.py --rules rules/manifest.json --out evidence/controls.json
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with: {name: evidence-bundle, path: evidence/}
      - name: Commit evidence
        run: |
          git config user.name "soc-bot" && git config user.email "soc-bot@users.noreply.github.com"
          git add evidence/ && git commit -m "chore: evidence bundle [skip ci]" || true
          git push
